name: Android library build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build, test, and package ZYRO
        run: >
          gradle
          :zyro-settings:assembleDebug
          :zyro-settings:assembleRelease
          :zyro-camera:assembleDebug
          :zyro-camera:assembleRelease
          :zyro-camera:testDebugUnitTest
          :zyro-demo:assembleDebug
      - name: Upload APK and AAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zyro-android-build
          if-no-files-found: error
          path: |
            zyro-demo/build/outputs/apk/debug/*.apk
            zyro-settings/build/outputs/aar/*.aar
            zyro-camera/build/outputs/aar/*.aar
