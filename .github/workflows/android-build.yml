name: Android library build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build, test, and package ZYRO libraries
        run: >
          gradle
          :zyro-settings:assembleDebug
          :zyro-settings:assembleRelease
          :zyro-camera:assembleDebug
          :zyro-camera:assembleRelease
          :zyro-camera:testDebugUnitTest
      - name: Upload Android library artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zyro-android-libraries
          if-no-files-found: error
          path: |
            zyro-settings/build/outputs/aar/*.aar
            zyro-camera/build/outputs/aar/*.aar
